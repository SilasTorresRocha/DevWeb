services:
  # FRONTEND (Next.js + Bootstrap) 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: planofacil_frontend
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - PORT=8000
    restart: unless-stopped
